name: Release Current Local Package

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'scripts/distribution/**'
      - 'scripts/local-codex/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/ai/proxy-endpoints.ts'
      - 'src/components/settings/AIConfigPanel.tsx'
      - 'src/components/settings/EmbeddingConfigCard.tsx'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json, for example v4.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release metadata
        if: github.event_name != 'pull_request'
        run: npm run check:release-metadata -- "${RELEASE_TAG}"
      - run: npm run test:distribution
      - name: Existing production release gates
        if: github.event_name != 'pull_request'
        run: npm run ci
      - name: Existing browser release gates
        if: github.event_name != 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          npm run ci:e2e
      - name: Build local portable channel
        run: |
          npm run build:portable
          node scripts/distribution/notices.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-web
          path: dist/
          retention-days: 5

  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-web
          path: dist/
      - name: Package verified official runtime
        run: python scripts/distribution/build-portable.py "${{ matrix.target }}"
      - name: Start the actual bundled runtime
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          python scripts/distribution/smoke-package.py "release/StoryForge-v${version}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 5

  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release-assets/
          merge-multiple: true
      - name: Publish only after all target packages pass
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          notes=".github/release-notes/${RELEASE_TAG}.md"
          test -f "$notes"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --draft --verify-tag --title "StoryForge ${RELEASE_TAG} · 本地便携版" --notes-file "$notes"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
          args=(--draft=false --notes-file "$notes")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--prerelease=false --latest); fi
          gh release edit "${RELEASE_TAG}" "${args[@]}"
