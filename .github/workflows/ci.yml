name: CI

# StoryForge CI(Phase 3.3)
# 在 push / PR 时跑全套守护:架构铁律 + 注册表完整性 + 文档一致性 + 类型 + 测试 + 构建。
# 任何一项失败则红,阻止"屎山复发"与回归。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Full checks / ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli
            script: ci
          - id: browser
            script: ci:e2e
    env:
      PLAYWRIGHT_FROZEN_WORKSPACE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Record exact source
        run: git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.id == 'browser'
        run: npx playwright install --with-deps chromium

      # The browser runner has its own filesystem. Production-preview tests
      # require a build here instead of relying on the CLI runner's dist/.
      - name: 构建生产预览
        if: matrix.id == 'browser'
        run: npm run build

      - name: 生产版模型与嵌入代理设置
        if: matrix.id == 'browser'
        run: PLAYWRIGHT_PRODUCTION_PREVIEW=1 npx playwright test tests/e2e/settings-proxy.spec.ts tests/e2e/codex-provider.spec.ts

      # Each complete command runs once, in an independent runner. The final
      # verify job requires both results; neither subset can make the PR green.
      - name: 完整交付检查
        run: npm run ${{ matrix.script }}

      - name: Preserve browser evidence
        if: ${{ !cancelled() && matrix.id == 'browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every full check to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
